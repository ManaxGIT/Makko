<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makko · Chọn tuần nhận gói</title><style>@font-face{font-family:Body;src:url('assets/weekly-food/body.ttf')}@font-face{font-family:Body;src:url('assets/weekly-food/body-bold.ttf');font-weight:700}@font-face{font-family:Display;src:url('assets/weekly-food/display.ttf')}*{box-sizing:border-box}body{background:#FBF8F0;color:#213A2F;font:14px/1.6 Body;margin:0;padding:24px}.phone{width:390px;max-width:100%;border:1px solid #E9E3D7;border-radius:24px;background:#FBF8F0;padding:20px}h1{font:700 28px Display;margin:8px 0 22px}h2{font-size:16px;margin:8px 0}.eyebrow{color:#D95D39;font-size:10px;letter-spacing:1.04px;font-weight:700}.small{font-size:12px;color:#798079}.card{border:1px solid #E9E3D7;background:white;border-radius:16px;padding:14px;margin:10px 0}button{font:inherit;color:inherit;cursor:pointer}.week{width:100%;text-align:left}.week.selected{background:#FFF2D6;border-color:#F4A261}.week strong,.week span{display:block}.choose{width:100%;text-align:left;background:none;border:0;padding:0}.preview{background:none;border:0;color:#D95D39;font-weight:700;padding:10px 0;min-height:44px}dialog{background:#FBF8F0;color:#213A2F;border:1px solid #E9E3D7;border-radius:20px;max-width:350px;width:90%;padding:20px}dialog::backdrop{background:#213A2F66}.badge{font-size:10px;color:#D95D39}.row{display:flex;justify-content:space-between;gap:14px;margin:8px 0}.primary{width:100%;background:#F4A261;border:0;border-radius:12px;padding:14px;font-weight:700}.primary:disabled{opacity:.5;cursor:default}.footer{border-top:1px solid #E9E3D7;padding-top:12px}.note{max-width:520px;font-size:12px;color:#798079}</style><section class="phone"><div class="eyebrow">GÓI NGUYÊN LIỆU · 2 NGƯỜI · CHỈ TỐI</div><h1>Chọn tuần sử dụng</h1><p class="small">Xem nguyên liệu và hạn đăng ký của từng tuần.</p><div id="weeks" role="radiogroup" aria-label="Chọn tuần sử dụng"></div><div class="footer"><p class="small" id="schedule"></p><button class="primary" id="continue">Tiếp tục đăng ký →</button><p class="small" id="result"></p></div></section><dialog id="menu"><div class="eyebrow" id="chosen"></div><h2>Nguyên liệu trong gói</h2><div id="ingredients"></div><button class="primary" onclick="document.getElementById('menu').close()">Đóng</button></dialog><p class="note">Bản mẫu tương tác · chỉ hiển thị tuần đang mở; nguyên liệu rút gọn để duyệt giao diện; không tạo hay công bố gói thật.</p><script>
const weeks=[{range:'02/11 – 08/11/2026',delivery:'01/11',cutoff:'25/10',open:false,ingredients:[['Thịt heo','1,08 kg'],['Gạo','4,2 kg']]},{range:'09/11 – 15/11/2026',delivery:'08/11',cutoff:'01/11',open:true,ingredients:[['Thịt heo','1,08 kg'],['Trứng gà','10 quả']]},{range:'16/11 – 22/11/2026',delivery:'15/11',cutoff:'08/11',open:true,ingredients:[['Cá nục','800 g'],['Đậu hũ','900 g']]}];let selected=1;const $=id=>document.getElementById(id);function render(){ $('weeks').innerHTML=weeks.map((w,i)=>w.open?`<div class="card week ${selected===i?'selected':''}"><button class="choose" role="radio" aria-checked="${selected===i}" data-week="${i}"><strong>${w.range}</strong><span class="small">Giao chậm nhất Chủ nhật, ${w.delivery}</span><span class="small">Hạn đăng ký: ${w.cutoff}</span><span class="badge">${w.open?'Đang mở đăng ký':'Đã hết hạn · Chỉ xem nguyên liệu'}</span></button><button class="preview" data-preview="${i}">Xem nguyên liệu trong gói →</button></div>`:'').join('');document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.week);render()});document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.preview);render();$('menu').showModal()});const w=weeks[selected];$('chosen').textContent='TUẦN '+w.range;$('ingredients').innerHTML=w.ingredients.map(([name,quantity])=>`<div class="row"><span>${name}</span><b>${quantity}</b></div>`).join('');$('schedule').textContent=w.open?'Đăng ký đến '+w.cutoff+' · Giao chậm nhất '+w.delivery:'Tuần này đã hết hạn đăng ký. Chọn tuần khác để tiếp tục.';$('continue').disabled=!w.open;$('result').textContent='';}$('continue').onclick=()=>{$('result').textContent='Tuần đã chọn: '+weeks[selected].range+' · Bản mẫu không tạo đơn thật.'};render();</script></html>
