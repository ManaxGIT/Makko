[project]
name = "makko-api"
version = "0.1.0"
description = "Makko FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.1",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
